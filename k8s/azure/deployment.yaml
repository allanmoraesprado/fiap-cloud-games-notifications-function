# Notifications Function (Azure Functions isolated host, Kafka triggers) on AKS. Rendered by the
# CD pipeline (envsubst): ${ACR_LOGIN_SERVER} and ${IMAGE_TAG} (full commit SHA). One replica:
# the topics have a single partition, so extra consumers in the group would stay idle.
# No Service: the function is event-driven only (the host listens on 80 for the probes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-function
  namespace: fcg
  labels:
    app: notifications-function
    app.kubernetes.io/name: notifications-function
    app.kubernetes.io/part-of: fiap-cloud-games
    app.kubernetes.io/version: "${IMAGE_TAG}"
  annotations:
    kubernetes.io/change-cause: "deploy ${IMAGE_TAG}"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notifications-function
  template:
    metadata:
      labels:
        app: notifications-function
        app.kubernetes.io/version: "${IMAGE_TAG}"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: notifications-function
          image: ${ACR_LOGIN_SERVER}/fcg-notifications-function:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: fcg-config                        # shared: Kafka__BootstrapServers
            - configMapRef:
                name: notifications-function-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
